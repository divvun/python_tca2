[tool.poetry]
name = "python-tca2"
version = "2.0.1"
description = "Align plain text files using the TCA2 algorithm"
authors = ["Børre Gaup <albbas@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
lxml = "^6.1.2"
typer = "^0.27.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.3"
pytest = "^9.1.1"
types-lxml = "^2026.2.16"

[tool.poetry.scripts]
tca2 = "python_tca2.alignment:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "F", #Pyflakes
    "B", #flake8-bugbear
    "A", #flake8-builtins 
    "C4", #flake8-comprehensions
    "ERA", #eradicate
    "I", #isort
    "PT", #flake8-pytest-style
    "C90", #mccabe
    "N", #pep8-naming
    "E", #pycodestyle error
    "PL" #Pylint
]
ignore = ["A003"]
